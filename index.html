<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오늘의 동반자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     오늘의 즐거움 (animal photo / fun fact) is fully automatic —
     nothing to set up. See the FUN_FACTS list in the <script>
     below if you ever want to edit or add to the fun facts.
     ============================================================ */

  :root{
    --paper:      #FAF6EE;
    --paper-card: #FFFEFA;
    --celadon:    #4A6D5C;
    --celadon-dk: #354F42;
    --persimmon:  #E8927C;
    --persimmon-dk:#CE7259;
    --ink:        #2B2B26;
    --ink-soft:   #6B6558;
    --line:       #E9E2D2;
    --shadow: 0 4px 18px rgba(43,43,38,0.07);
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Gowun Dodum', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body{ padding-bottom: 48px; }

  h1,h2,h3{
    font-family: 'Gowun Batang', serif;
    margin: 0 0 10px 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .wrap{ max-width: 560px; margin: 0 auto; padding: 0 18px; }

  /* ---------- Living sky header ---------- */
  .sky{
    position: relative;
    padding: 40px 18px 34px 18px;
    margin-bottom: 22px;
    overflow: hidden;
    transition: background 1.2s ease;
    border-radius: 0 0 28px 28px;
  }
  .sky-inner{ max-width: 560px; margin: 0 auto; position: relative; z-index: 2; }
  .sky svg.orb{ position:absolute; right: 22px; top: 26px; width: 64px; height: 64px; z-index:1; opacity:0.9;}
  .date-line{
    font-size: 17px;
    color: var(--ink);
    opacity: 0.75;
    margin-bottom: 4px;
  }
  .greeting{
    font-size: 30px;
    line-height: 1.35;
    color: var(--ink);
  }
  .subgreeting{
    font-size: 18px;
    margin-top: 6px;
    color: var(--ink);
    opacity: 0.8;
  }

  /* ---------- Cards ---------- */
  .card{
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 22px 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .card-label{
    font-size: 15px;
    color: var(--celadon-dk);
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-label .dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--persimmon);
    display:inline-block;
  }
  .card p{ font-size: 20px; line-height: 1.75; margin: 0 0 8px 0; }
  .card p:last-child{ margin-bottom: 0; }

  /* ---------- Joy card (cute animal photo / fun fact) ---------- */
  .joy-card{ padding: 18px; }
  .joy-photo{
    width: 100%; display:block;
    border-radius: 16px;
    max-height: 320px;
    object-fit: cover;
  }
  .joy-photo-caption{
    text-align:center; font-size: 17px; color: var(--ink-soft);
    padding: 10px 6px 2px 6px;
  }
  .joy-fact{
    text-align: center;
    padding: 14px 10px 6px 10px;
  }
  .joy-fact .emoji{ font-size: 52px; line-height: 1; margin-bottom: 12px; }
  .joy-fact p{
    font-size: 20px; line-height: 1.75; margin: 0;
    font-family: 'Gowun Batang', serif;
  }

  /* ---------- Weather ---------- */
  .weather-row{ display:flex; align-items:center; gap: 16px; }
  .weather-emoji{ font-size: 46px; line-height:1; }
  .weather-temp{ font-size: 32px; font-family:'Gowun Batang',serif; font-weight:700; }
  .weather-desc{ font-size: 18px; color: var(--ink-soft); margin-top:2px; }

  /* ---------- News ---------- */
  .news-item{ display:flex; gap:10px; margin-bottom:14px; align-items:flex-start; }
  .news-item:last-child{ margin-bottom:0; }
  .news-item .bullet{ color: var(--persimmon-dk); font-size:20px; line-height:1.6; }
  .news-item p{ margin:0; }
  .skeleton{
    height: 20px; border-radius: 8px;
    background: linear-gradient(90deg, var(--line) 25%, #f3efe2 37%, var(--line) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.6s infinite;
    margin-bottom: 10px;
  }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

  /* ---------- Quote ---------- */
  .quote-card{
    background: var(--celadon);
    color: #FBF9F2;
    border: none;
  }
  .quote-card .card-label{ color: #D8E8DF; }
  .quote-card .dot{ background:#F0C6B7; }
  .quote-text{
    font-family: 'Gowun Batang', serif;
    font-size: 23px;
    line-height: 1.7;
  }

  /* ---------- Journaling ---------- */
  .prompt-line{
    font-size: 20px; line-height:1.75;
    padding: 12px 14px;
    background: #F5EFDF;
    border-radius: 14px;
    margin-bottom: 10px;
  }
  .prompt-line:last-child{ margin-bottom:0; }

  /* ---------- Chat ---------- */
  .chat-card{ padding-bottom: 18px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 14px; }
  .chip{
    background: #F5EFDF;
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 16px;
    padding: 10px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .chip:active{ background: var(--line); }

  .chat-log{ margin-bottom: 14px; }
  .bubble{
    font-size: 19px; line-height:1.7;
    padding: 14px 16px;
    border-radius: 16px;
    margin-bottom: 10px;
    max-width: 92%;
  }
  .bubble.me{
    background: var(--celadon);
    color: #FBF9F2;
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .bubble.claude{
    background: #F5EFDF;
    color: var(--ink);
    margin-right: auto;
    border-bottom-left-radius: 4px;
  }
  .bubble.claude .speak-btn{
    margin-top:8px;
    font-size:14px;
    background:none;
    border:1px solid var(--celadon);
    color:var(--celadon-dk);
    border-radius:999px;
    padding:6px 12px;
    cursor:pointer;
  }

  .input-row{
    display:flex; gap:10px; align-items:flex-end;
  }
  #chatInput{
    flex: 1;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 19px;
    padding: 14px 16px;
    border: 2px solid var(--line);
    border-radius: 16px;
    resize: none;
    min-height: 56px;
    max-height: 140px;
    color: var(--ink);
    background: #fff;
  }
  #chatInput:focus{ outline: none; border-color: var(--celadon); }

  .round-btn{
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    display:flex; align-items:center; justify-content:center;
    font-size: 24px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #sendBtn{ background: var(--celadon); color: white; }
  #sendBtn:disabled{ opacity: 0.5; }

  .hint{ font-size: 15px; color: var(--ink-soft); margin-top:10px; text-align:center; }
  .footer-note{ text-align:center; font-size:14px; color:var(--ink-soft); opacity:0.7; margin-top: 6px; }

  @media (prefers-reduced-motion: reduce){
    .skeleton{ animation:none; }
  }
</style>
</head>
<body>

<div class="sky" id="skyHeader">
  <svg class="orb" id="orbSvg" viewBox="0 0 64 64"></svg>
  <div class="sky-inner">
    <div class="date-line" id="dateLine"></div>
    <div class="greeting" id="greetingLine"></div>
    <div class="subgreeting" id="subGreetingLine"></div>
  </div>
</div>

<div class="wrap">

  <!-- 오늘의 즐거움 -->
  <div class="card joy-card" id="joyCard">
    <div class="card-label"><span class="dot"></span>오늘의 즐거움</div>
    <div id="joyBody">
      <div class="skeleton" style="width:100%; height:160px; border-radius:16px;"></div>
    </div>
  </div>

  <!-- 날씨 -->
  <div class="card" id="weatherCard">
    <div class="card-label"><span class="dot"></span>오늘의 날씨 · 시드니</div>
    <div class="weather-row" id="weatherRow">
      <div class="weather-emoji">⏳</div>
      <div>
        <div class="weather-temp">불러오는 중...</div>
      </div>
    </div>
  </div>

  <!-- 소식 -->
  <div class="card" id="newsCard">
    <div class="card-label"><span class="dot"></span><span id="newsLabel">오늘의 소식</span></div>
    <div id="newsBody">
      <div class="skeleton" style="width:95%"></div>
      <div class="skeleton" style="width:88%"></div>
      <div class="skeleton" style="width:70%"></div>
    </div>
  </div>

  <!-- 한마디 -->
  <div class="card quote-card">
    <div class="card-label"><span class="dot"></span>오늘의 한마디</div>
    <div class="quote-text" id="quoteText"></div>
  </div>

  <!-- 일기 -->
  <div class="card" id="journalCard">
    <div class="card-label"><span class="dot"></span>오늘의 일기 질문</div>
    <div id="journalBody"></div>
  </div>

  <!-- 대화 -->
  <div class="card chat-card">
    <div class="card-label"><span class="dot"></span>🤖 Claude와 이야기하기</div>
    <p style="font-size:16px; color:var(--ink-soft); margin:-2px 0 14px 0; line-height:1.6;">
      궁금한 것이 있으면 무엇이든 물어보세요. 사람이 아니라, 대답해주는 인공지능(AI) 친구예요.
    </p>
    <div class="chips" id="chips"></div>
    <div class="chat-log" id="chatLog"></div>
    <div class="input-row">
      <textarea id="chatInput" rows="1" placeholder="여기에 적어보세요..."></textarea>
      <button class="round-btn" id="sendBtn" title="보내기">➤</button>
    </div>
    <div class="hint">말로 하고 싶으면, 키보드에 있는 🎤 아이콘을 눌러서 말씀하세요.</div>
  </div>

  <div class="footer-note">오늘도 좋은 하루 되세요 🌿</div>

</div>

<script>
/* ============================================================
   1) 오늘의 즐거움 — 귀여운 동물 사진과 함께 번갈아 나오는
      재미있는 이야기 (curated, always wholesome — never news-based)
   ============================================================ */
const FUN_FACTS = [

  ["🌙", "달은 매년 손톱이 자라는 속도만큼 지구에서 조금씩 멀어지고 있대요."],

  ["🐝", "꿀벌은 춤으로 서로에게 꽃이 있는 곳을 알려준대요."],

  ["🐬", "돌고래는 서로를 이름처럼 부르는 자기만의 소리를 가지고 있대요."],
  ["🌊", "파도 소리를 들으면 마음이 편안해지는 건, 심장 박동과 비슷한 리듬이기 때문이래요."],
  ["🍂", "낙엽이 떨어지는 것도 나무가 겨울을 준비하는 지혜래요."],
  ["🌸", "벚꽃은 피어서 지기까지 보통 일주일 정도래요, 그래서 더 소중하대요."],
  ["🦋", "나비는 발로 꽃의 맛을 본다고 해요."],
  ["🍵", "차 한 잔을 천천히 마시는 것만으로도 마음이 편안해진대요."],
  ["🌟", "밤하늘의 별빛은 수천 년 전에 출발한 빛일 수도 있대요."],
  ["🐑", "양은 사람처럼 서로의 얼굴을 기억한다고 해요."],
  ["🐢", "거북이는 등딱지로도 촉감을 느낄 수 있대요."],
  ["🌼", "작은 화분 하나를 돌보는 것만으로도 하루가 조금 더 즐거워진대요."]

/* ============================================================
   2) 오늘의 한마디 (rotating daily quotes)
   ============================================================ */
const QUOTES = [
  "천천히 걸어도 괜찮아요, 멈추지만 않으면 돼요.",
  "오늘 하루도 나에게 잘했다고 말해주세요.",
  "작은 기쁨을 알아차리는 것도 큰 지혜예요.",
  "햇살이 좋은 날엔, 그 햇살만으로도 충분해요.",

  "잘 자는 것도 훌륭한 하루의 마무리예요.",
  "몸이 힘들면 쉬라는 신호예요, 들어주세요.",

  "기억은 흐려져도 마음은 여전히 따뜻해요.",
  "누군가에게 오늘 안부를 물어보는 건 어때요?",

/* ============================================================
   3) 오늘의 일기 질문 (rotating journaling prompt pairs)
   ============================================================ */
const JOURNAL_PAIRS = [
  ["오늘 가장 기분 좋았던 순간은 언제였나요?", "어제 하루는 어떠셨어요? 기억나는 일이 있나요?"],
  ["오늘 먹은 음식 중에 제일 맛있었던 건 뭐예요?", "이번 주에 하고 싶은 일이 있으세요?"],
  ["요즘 자주 떠오르는 옛 기억이 있나요?", "오늘 몸 상태는 어땠나요?"],

  ["오늘 하루 중 가장 평화로웠던 시간은 언제였나요?", "요즘 배우거나 해보고 싶은 것이 있으세요?"],
  ["오늘 몸을 움직인 시간이 있었나요? 어땠나요?", "요즘 자주 웃게 만드는 것이 있나요?"],
  ["어제는 누구와 이야기를 나눴나요? 어떤 이야기였나요?", "지금 가장 그리운 장소가 있다면 어디인가요?"],
  ["오늘 하루 중 잊고 싶지 않은 순간이 있나요?", "요즘 걱정되는 것이 있다면 편하게 적어보세요."],
  ["오늘 아침에 눈을 뜨고 처음 든 생각은 무엇이었나요?", "요즘 손주(또는 가족)에게 해주고 싶은 말이 있나요?"],
  ["오늘 하루, 나에게 칭찬해주고 싶은 일은 무엇인가요?", "이번 계절에 해보고 싶은 일이 있다면 무엇인가요?"],
  ["어제 저녁에는 무엇을 하셨어요?", "다음 달쯤, 기대되거나 계획하고 있는 일이 있나요?"],
  ["요즘 자주 생각나는 사람이나 추억이 있나요?", "앞으로 새로 해보고 싶은 취미가 있으세요?"],

/* ============================================================
   4) 소식 대신 보여줄 예비 이야기 (fallback content if the
      live news fetch isn't available — e.g. when this file is
      opened outside of Claude)
   ============================================================ */
const FALLBACK_STORIES = [
  "오늘은 창밖을 보며 잠깐이라도 하늘을 올려다보는 시간을 가져보는 건 어떨까요.",
  "따뜻한 차 한 잔과 함께 좋아하는 노래를 들어보는 하루가 되면 좋겠어요.",
  "오늘 만나는 사람에게 먼저 웃으며 인사를 건네보세요.",

/* ============================================================
   내부 동작 (core logic — no need to edit below this line)
   ============================================================ */

function dayIndex(len){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const diff = now - start;
  const oneDay = 1000*60*60*24;
  const doy = Math.floor(diff/oneDay);
  return doy % len;
}

// ---- Sky + greeting ----
function paintSky(){
  const h = new Date().getHours();
  const sky = document.getElementById('skyHeader');
  const orb = document.getElementById('orbSvg');
  let bg, greet, sub, orbSvg;

  if(h>=5 && h<8){
    bg = 'linear-gradient(160deg,#F7DFC9,#F3C6A8)';
    greet = '좋은 아침이에요 ☀️';
    sub = '오늘 하루도 편안하게 시작해보세요.';
    orbSvg = sunSvg('#F0A868');
  } else if(h>=8 && h<17){
    bg = 'linear-gradient(160deg,#E7EFE6,#DCEBE0)';
    greet = '좋은 오후예요 🌿';
    sub = '오늘 하루는 어떻게 흘러가고 있나요?';
    orbSvg = sunSvg('#E8927C');
  } else if(h>=17 && h<20){
    bg = 'linear-gradient(160deg,#E7C9CE,#CBA9C2)';
    greet = '좋은 저녁이에요 🌇';
    sub = '오늘 하루도 참 잘 보내셨어요.';
    orbSvg = sunSvg('#D97757');
  } else {
    bg = 'linear-gradient(160deg,#3C4A45,#28332E)';
    greet = '편안한 밤 되세요 🌙';
    sub = '오늘 하루도 수고 많으셨어요.';
    orbSvg = moonSvg();
    sky.querySelector('.date-line').style.color = '#F2EEE2';
    sky.querySelector('.greeting').style.color = '#F2EEE2';
    sky.querySelector('.subgreeting').style.color = '#D9D4C6';
  }
  sky.style.background = bg;
  orb.innerHTML = orbSvg;

  document.getElementById('dateLine').textContent =
    new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  document.getElementById('greetingLine').textContent = greet;
  document.getElementById('subGreetingLine').textContent = sub;
}
function sunSvg(color){
  return `<circle cx="32" cy="32" r="14" fill="${color}"/>
  ${[0,45,90,135,180,225,270,315].map(a=>`<line x1="32" y1="32" x2="32" y2="32"
    transform="rotate(${a} 32 32) translate(0 -24)" stroke="${color}" stroke-width="3" stroke-linecap="round"
    x2="0" y2="-8"/>`).join('')}`;
}
function moonSvg(){
  return `<path d="M40 12a20 20 0 1 0 12 36 16 16 0 0 1-12-36z" fill="#F2EEE2"/>
  <circle cx="14" cy="18" r="1.4" fill="#F2EEE2"/>
  <circle cx="10" cy="30" r="1" fill="#F2EEE2"/>
  <circle cx="20" cy="10" r="0.8" fill="#F2EEE2"/>`;
}
paintSky();

async function loadJoy(){
  const slot = dayIndex(3); // 0,1 -> animal photo (dog/cat) · 2 -> fun fact
  if(slot === 2){ showFact(); return; }

  try{
    let url, label;
    if(slot === 0){
      const res = await fetch('https://dog.ceo/api/breeds/image/random');
      const data = await res.json();
      if(data.status !== 'success') throw new Error('no dog');
      url = data.message; label = '오늘의 강아지 🐶';
    } else {
      const res = await fetch('https://api.thecatapi.com/v1/images/search');
      const data = await res.json();
      if(!data[0] || !data[0].url) throw new Error('no cat');
      url = data[0].url; label = '오늘의 고양이 🐱';
    }
    const body = document.getElementById('joyBody');
    body.innerHTML = `<img class="joy-photo" src="${url}" alt="${label}"><div class="joy-photo-caption">${label}</div>`;
  }catch(e){
    showFact(); // graceful, guaranteed-safe fallback
  }
}
loadJoy();

  45:['안개','🌫️'],48:['안개','🌫️'],
  51:['이슬비','🌦️'],53:['이슬비','🌦️'],55:['이슬비','🌦️'],
  61:['비','🌧️'],63:['비','🌧️'],65:['많은 비','🌧️'],
  71:['눈','🌨️'],73:['눈','🌨️'],75:['많은 눈','🌨️'],
  80:['소나기','🌦️'],81:['소나기','🌦️'],82:['강한 소나기','⛈️'],
  95:['천둥번개','⛈️'],96:['천둥번개','⛈️'],99:['천둥번개','⛈️']

async function loadWeather(){

// ---- News (tries live Claude+web-search; falls back gracefully) ----
async function callClaude(messages, useSearch){
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: 700,
    messages: messages
  };
  if(useSearch){
    body.tools = [{ type: "web_search_20250305", name: "web_search" }];
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("API request failed");
  const data = await res.json();
  const textBlocks = (data.content || []).filter(b => b.type === "text").map(b => b.text);
  return textBlocks.join("\n").trim();
}

async function loadNews(){
  try{
    const prompt = `오늘 날짜 기준으로, 호주에 사는 한국어를 쓰는 어르신이 읽기 좋은,
    부담스럽지 않은 뉴스나 소식 3가지를 아주 쉽고 짧은 한국어 문장으로 알려주세요.
    (심각한 사건사고, 정치 갈등, 자극적인 내용은 피하고, 날씨/생활/문화/건강 관련
    가볍고 흥미로운 소식 위주로) 각 소식은 한 문장으로, 번호 없이 줄바꿈으로만
    구분해서 답해주세요. 다른 설명은 붙이지 마세요.`;
    const text = await callClaude([{role:"user", content: prompt}], true);
    const lines = text.split("\n").map(l=>l.replace(/^[-•\d.\)\s]+/,'').trim()).filter(Boolean).slice(0,3);
    if(lines.length === 0) throw new Error("empty");
    document.getElementById('newsLabel').textContent = '오늘의 소식';
    document.getElementById('newsBody').innerHTML = lines.map(l =>
      `<div class="news-item"><span class="bullet">·</span><p>${l}</p></div>`).join('');
  }catch(e){
    // Graceful fallback — deterministic, always works offline
    document.getElementById('newsLabel').textContent = '오늘의 이야기';
    const idx = dayIndex(FALLBACK_STORIES.length);
    document.getElementById('newsBody').innerHTML =
      `<div class="news-item"><span class="bullet">·</span><p>${FALLBACK_STORIES[idx]}</p></div>`;
  }
}
loadNews();

// ---- Chat ----
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
let chatHistory = [];

const SUGGESTIONS = [
  "오늘 기분이 어때요?",
  "오늘 저녁 뭐 먹을지 추천해줄래요?",
  "재미있는 이야기 하나 해줄래요?",
  "오늘 날씨에 어울리는 노래 추천해줘요"
];
document.getElementById('chips').innerHTML = SUGGESTIONS.map(s =>
  `<button class="chip" onclick="sendMessage('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('');

function addBubble(text, who){
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  if(who === 'claude'){
    div.innerHTML = `<span style="opacity:0.85;">🤖</span> <span class="msg-text"></span><br><button class="speak-btn">🔊 들려주기</button>`;
    div.querySelector('.msg-text').textContent = text;
    div.querySelector('.speak-btn').onclick = () => speak(text);
  } else {
    div.textContent = text;
  }
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}

async function sendMessage(overrideText){
  const text = (overrideText !== undefined ? overrideText : chatInput.value).trim();
  if(!text) return;
  addBubble(text, 'me');
  chatInput.value = '';
  sendBtn.disabled = true;

  const thinking = addBubble('...생각하는 중이에요', 'claude');

  chatHistory.push({role:"user", content: text});
  try{
    const systemPrimer = {
      role: "user",
      content: `당신은 나이 드신 분과 대화하는 다정한 대화 상대입니다. 상대는 한국어와
      영어를 모두 편하게 사용하는 분이니, 상대가 쓰는 언어에 맞춰 답해주세요
      (Respond in whichever language they use, Korean or English).
      항상 존댓말을 쓰고, 짧고 쉬운 문장으로, 따뜻하고 친절하게 대답하세요.
      너무 길게 답하지 말고 2~4문장 정도로 답해주세요.`
    };
    const reply = await callClaude([systemPrimer, ...chatHistory], false);
    thinking.remove();
    addBubble(reply || '죄송해요, 지금은 잘 모르겠어요.', 'claude');
    chatHistory.push({role:"assistant", content: reply});
  }catch(e){
    thinking.remove();
    addBubble('지금은 대화 기능을 사용할 수 없어요. 잠시 후 다시 시도해 주세요.', 'claude');
  }finally{
    sendBtn.disabled = false;
  }
}
window.sendMessage = sendMessage;
sendBtn.addEventListener('click', () => sendMessage());
chatInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});

// ---- Speak aloud ----
// Uses the device's own text-to-speech (generally on-device, not sent to a server).
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ko-KR';
  const voices = window.speechSynthesis.getVoices();
  const koVoice = voices.find(v => v.lang && v.lang.startsWith('ko'));
  if(koVoice) utter.voice = koVoice;
  window.speechSynthesis.speak(utter);
}
</script>
