<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오늘의 동반자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     오늘의 즐거움 (animal photo / fun fact) is fully automatic —
     nothing to set up. See the FUN_FACTS list in the <script>
     below if you ever want to edit or add to the fun facts.
     ============================================================ */

  :root{
    --paper:      #FAF6EE;
    --paper-card: #FFFEFA;
    --celadon:    #4A6D5C;
    --celadon-dk: #354F42;
    --persimmon:  #E8927C;
    --persimmon-dk:#CE7259;
    --ink:        #2B2B26;
    --ink-soft:   #6B6558;
    --line:       #E9E2D2;
    --shadow: 0 4px 18px rgba(43,43,38,0.07);
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Gowun Dodum', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body{ padding-bottom: 48px; }

  h1,h2,h3{
    font-family: 'Gowun Batang', serif;
    margin: 0 0 10px 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .wrap{ max-width: 560px; margin: 0 auto; padding: 0 18px; }

  /* ---------- Living sky header ---------- */
  .sky{
    position: relative;
    padding: 40px 18px 34px 18px;
    margin-bottom: 22px;
    overflow: hidden;
    transition: background 1.2s ease;
    border-radius: 0 0 28px 28px;
  }
  .sky-inner{ max-width: 560px; margin: 0 auto; position: relative; z-index: 2; }
  .sky svg.orb{ position:absolute; right: 22px; top: 26px; width: 64px; height: 64px; z-index:1; opacity:0.9;}
  .date-line{
    font-size: 17px;
    color: var(--ink);
    opacity: 0.75;
    margin-bottom: 4px;
  }
  .greeting{
    font-size: 30px;
    line-height: 1.35;
    color: var(--ink);
  }
  .subgreeting{
    font-size: 18px;
    margin-top: 6px;
    color: var(--ink);
    opacity: 0.8;
  }

  /* ---------- Cards ---------- */
  .card{
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 22px 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .card-label{
    font-size: 15px;
    color: var(--celadon-dk);
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-label .dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--persimmon);
    display:inline-block;
  }
  .card p{ font-size: 20px; line-height: 1.75; margin: 0 0 8px 0; }
  .card p:last-child{ margin-bottom: 0; }

  /* ---------- Joy card (cute animal photo / fun fact) ---------- */
  .joy-card{ padding: 18px; }
  .joy-photo{
    width: 100%; display:block;
    border-radius: 16px;
    max-height: 320px;
    object-fit: cover;
  }
  .joy-photo-caption{
    text-align:center; font-size: 17px; color: var(--ink-soft);
    padding: 10px 6px 2px 6px;
  }
  .joy-fact{
    text-align: center;
    padding: 14px 10px 6px 10px;
  }
  .joy-fact .emoji{ font-size: 52px; line-height: 1; margin-bottom: 12px; }
  .joy-fact p{
    font-size: 20px; line-height: 1.75; margin: 0;
    font-family: 'Gowun Batang', serif;
  }

  /* ---------- Weather ---------- */
  .weather-row{ display:flex; align-items:center; gap: 16px; }
  .weather-emoji{ font-size: 46px; line-height:1; }
  .weather-temp{ font-size: 32px; font-family:'Gowun Batang',serif; font-weight:700; }
  .weather-desc{ font-size: 18px; color: var(--ink-soft); margin-top:2px; }

  /* ---------- News ---------- */
  .news-item{ display:flex; gap:10px; margin-bottom:14px; align-items:flex-start; }
  .news-item:last-child{ margin-bottom:0; }
  .news-item .bullet{ color: var(--persimmon-dk); font-size:20px; line-height:1.6; }
  .news-item p{ margin:0; }
  .skeleton{
    height: 20px; border-radius: 8px;
    background: linear-gradient(90deg, var(--line) 25%, #f3efe2 37%, var(--line) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.6s infinite;
    margin-bottom: 10px;
  }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

  /* ---------- Quote ---------- */
  .quote-card{
    background: var(--celadon);
    color: #FBF9F2;
    border: none;
  }
  .quote-card .card-label{ color: #D8E8DF; }
  .quote-card .dot{ background:#F0C6B7; }
  .quote-text{
    font-family: 'Gowun Batang', serif;
    font-size: 23px;
    line-height: 1.7;
  }

  /* ---------- Journaling ---------- */
  .prompt-line{
    font-size: 20px; line-height:1.75;
    padding: 12px 14px;
    background: #F5EFDF;
    border-radius: 14px;
    margin-bottom: 10px;
  }
  .prompt-line:last-child{ margin-bottom:0; }

  /* ---------- Chat ---------- */
  .chat-card{ padding-bottom: 18px; }

  .hint{ font-size: 15px; color: var(--ink-soft); margin-top:10px; text-align:center; }
  .footer-note{ text-align:center; font-size:14px; color:var(--ink-soft); opacity:0.7; margin-top: 6px; }

  @media (prefers-reduced-motion: reduce){
    .skeleton{ animation:none; }
  }
</style>
</head>
<body>

<div class="sky" id="skyHeader">
  <svg class="orb" id="orbSvg" viewBox="0 0 64 64"></svg>
  <div class="sky-inner">
    <div class="date-line" id="dateLine"></div>
    <div class="greeting" id="greetingLine"></div>
    <div class="subgreeting" id="subGreetingLine"></div>
  </div>
</div>

<div class="wrap">

  <!-- 오늘의 즐거움 -->
  <div class="card joy-card" id="joyCard">
    <div class="card-label"><span class="dot"></span>오늘의 즐거움</div>
    <div id="joyBody">
      <div class="skeleton" style="width:100%; height:160px; border-radius:16px;"></div>
    </div>

  <!-- 뉴스 -->
  <div class="card" id="newsCard">
    <div class="card-label"><span class="dot"></span>오늘의 뉴스</div>
    <p style="font-size:15px; color:var(--ink-soft); margin:-4px 0 14px 0;">실제 뉴스 헤드라인이에요 (매일 아침 새로 업데이트)</p>
    <div style="margin-bottom:16px;">
      <div style="font-weight:700; color:var(--celadon-dk); font-size:16px; margin-bottom:8px;">🇦🇺 호주 소식</div>
      <div id="localNewsBody">
        <div class="skeleton" style="width:90%"></div>
        <div class="skeleton" style="width:75%"></div>
      </div>
    </div>
    <div>
      <div style="font-weight:700; color:var(--celadon-dk); font-size:16px; margin-bottom:8px;">🌏 세계 소식</div>
      <div id="worldNewsBody">
        <div class="skeleton" style="width:90%"></div>
        <div class="skeleton" style="width:75%"></div>
      </div>
    </div>
  </div>

  <!-- 한마디 -->
  <div class="card quote-card">
    <div class="card-label"><span class="dot"></span>오늘의 한마디</div>

  <!-- 일기 -->
  <div class="card" id="journalCard">
    <div class="card-label"><span class="dot"></span>오늘의 일기 질문</div>
    <div id="journalBody"></div>
  </div>

  <!-- Claude로 연결 -->
  <div class="card chat-card">
    <div class="card-label"><span class="dot"></span>🤖 Claude와 이야기하기</div>
    <p style="font-size:18px; line-height:1.75; margin: -2px 0 16px 0;">
      궁금한 것이 있으면 무엇이든 물어보세요. 사람이 아니라, 대답해주는 인공지능(AI) 친구예요.
      예를 들어, <span id="chatExample">"재미있는 이야기 하나 해줄래요?"</span>처럼 물어보세요.
    </p>
    <a href="https://claude.ai" target="_blank" rel="noopener"
       style="display:block; text-align:center; background:var(--celadon); color:#fff;
       font-family:'Gowun Dodum',sans-serif; font-size:20px; text-decoration:none;
       padding:16px; border-radius:16px; margin-top: 6px;">
      🤖 Claude와 대화 시작하기
    </a>
    <div class="hint">버튼을 누르면 Claude 앱이 열려요.</div>
  </div>

  <div class="footer-note">오늘도 좋은 하루 되세요 🌿</div>

</div>

<script>

/* ============================================================
   내부 동작 (core logic — no need to edit below this line)
   ============================================================ */

function dayIndex(len){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const diff = now - start;
  const oneDay = 1000*60*60*24;
  const doy = Math.floor(diff/oneDay);
  return doy % len;
}

// ---- Sky + greeting ----
function paintSky(){
  const h = new Date().getHours();
  const sky = document.getElementById('skyHeader');
  const orb = document.getElementById('orbSvg');
  let bg, greet, sub, orbSvg;

  if(h>=5 && h<8){
    bg = 'linear-gradient(160deg,#F7DFC9,#F3C6A8)';
    greet = '좋은 아침이에요 ☀️';
    sub = '오늘 하루도 편안하게 시작해보세요.';
    orbSvg = sunSvg('#F0A868');
  } else if(h>=8 && h<11){
    bg = 'linear-gradient(160deg,#E7EFE6,#DCEBE0)';
    greet = '좋은 아침이에요 🌿';
    sub = '오늘 하루는 어떻게 흘러가고 있나요?';
    orbSvg = sunSvg('#E8927C');
  } else if(h>=11 && h<17){
    bg = 'linear-gradient(160deg,#E7EFE6,#DCEBE0)';
    greet = '좋은 오후예요 🌿';
    sub = '오늘 하루는 어떻게 흘러가고 있나요?';
    orbSvg = sunSvg('#E8927C');
  } else if(h>=17 && h<20){
    bg = 'linear-gradient(160deg,#E7C9CE,#CBA9C2)';
    greet = '좋은 저녁이에요 🌇';
    sub = '오늘 하루도 참 잘 보내셨어요.';
    orbSvg = sunSvg('#D97757');
  } else {
    bg = 'linear-gradient(160deg,#3C4A45,#28332E)';
    greet = '편안한 밤 되세요 🌙';
    sub = '오늘 하루도 수고 많으셨어요.';
    orbSvg = moonSvg();
    sky.querySelector('.date-line').style.color = '#F2EEE2';
    sky.querySelector('.greeting').style.color = '#F2EEE2';
    sky.querySelector('.subgreeting').style.color = '#D9D4C6';
  }
  sky.style.background = bg;
  orb.innerHTML = orbSvg;

  document.getElementById('dateLine').textContent =
    new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  document.getElementById('greetingLine').textContent = greet;
  document.getElementById('subGreetingLine').textContent = sub;
}
function sunSvg(color){
  return `<circle cx="32" cy="32" r="14" fill="${color}"/>
  ${[0,45,90,135,180,225,270,315].map(a=>`<line x1="32" y1="32" x2="32" y2="32"
    transform="rotate(${a} 32 32) translate(0 -24)" stroke="${color}" stroke-width="3" stroke-linecap="round"
    x2="0" y2="-8"/>`).join('')}`;
}
function moonSvg(){
  return `<path d="M40 12a20 20 0 1 0 12 36 16 16 0 0 1-12-36z" fill="#F2EEE2"/>
  <circle cx="14" cy="18" r="1.4" fill="#F2EEE2"/>

// ---- Joy card: cute animal photo (most days) or fun fact (otherwise) ----
function showFact(){
  const [emoji, fact] = FUN_FACTS[dayIndex(FUN_FACTS.length)];
  document.getElementById('joyBody').innerHTML =
    `<div class="joy-fact"><div class="emoji">${emoji}</div><p>${fact}</p></div>`;
}

async function loadJoy(){
  const slot = dayIndex(3); // 0,1 -> animal photo (dog/cat) · 2 -> fun fact
  if(slot === 2){ showFact(); return; }

  try{
    let url, label;
    if(slot === 0){
      const res = await fetch('https://dog.ceo/api/breeds/image/random');
      const data = await res.json();
      if(data.status !== 'success') throw new Error('no dog');
      url = data.message; label = '오늘의 강아지 🐶';
    } else {
      const res = await fetch('https://api.thecatapi.com/v1/images/search');
      const data = await res.json();
      if(!data[0] || !data[0].url) throw new Error('no cat');
      url = data[0].url; label = '오늘의 고양이 🐱';
    }
    const body = document.getElementById('joyBody');
    body.innerHTML = `<img class="joy-photo" src="${url}" alt="${label}"><div class="joy-photo-caption">${label}</div>`;
    // If the image itself fails to load (broken/slow link), fall back to a fact.
    body.querySelector('img').addEventListener('error', () => { showFact(); }, { once: true });
  }catch(e){
    showFact(); // graceful, guaranteed-safe fallback
  }
}
loadJoy();

// ---- Weather (Open-Meteo, Sydney — no key needed) ----
const WEATHER_CODES = {
  0:['맑음','☀️'],1:['대체로 맑음','🌤️'],2:['구름 조금','⛅'],3:['흐림','☁️'],
  45:['안개','🌫️'],48:['안개','🌫️'],
  51:['이슬비','🌦️'],53:['이슬비','🌦️'],55:['이슬비','🌦️'],
  61:['비','🌧️'],63:['비','🌧️'],65:['많은 비','🌧️'],
  71:['눈','🌨️'],73:['눈','🌨️'],75:['많은 눈','🌨️'],
  80:['소나기','🌦️'],81:['소나기','🌦️'],82:['강한 소나기','⛈️'],
  95:['천둥번개','⛈️'],96:['천둥번개','⛈️'],99:['천둥번개','⛈️']
};
async function loadWeather(){
  try{
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-33.8688&longitude=151.2093&current=temperature_2m,weather_code&timezone=Australia%2FSydney');
    const data = await res.json();
    const t = Math.round(data.current.temperature_2m);
    const code = data.current.weather_code;
    const [desc, emoji] = WEATHER_CODES[code] || ['알 수 없음','🌡️'];
    document.getElementById('weatherRow').innerHTML = `
      <div class="weather-emoji">${emoji}</div>
      <div>
        <div class="weather-temp">${t}°C</div>
        <div class="weather-desc">${desc} · 시드니</div>
      </div>`;
  }catch(e){
    document.getElementById('weatherRow').innerHTML = `
      <div class="weather-emoji">🌤️</div>
      <div><div class="weather-desc">날씨 정보를 지금은 가져올 수 없어요.</div></div>`;
  }
}
loadWeather();

// ---- 오늘의 뉴스 (reads news.json, kept fresh by a daily GitHub Action) ----
function renderNewsList(elId, items){
  const el = document.getElementById(elId);
  if(!items || items.length === 0){
    el.innerHTML = '<p style="color:var(--ink-soft); font-size:18px;">지금은 뉴스를 가져올 수 없어요.</p>';
    return;
  }
  el.innerHTML = items.map(t =>
    `<div class="news-item"><span class="bullet">·</span><p>${t}</p></div>`).join('');
}

async function loadNews(){
  try{
    const res = await fetch(`./news.json?t=${Date.now()}`); // cache-busted
    if(!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    renderNewsList('localNewsBody', data.local);
    renderNewsList('worldNewsBody', data.world);
  }catch(e){
    renderNewsList('localNewsBody', []);
    renderNewsList('worldNewsBody', []);
  }
}
loadNews();
